<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Pixel Art</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ffffff;
            text-shadow: 2px 2px #000;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            margin-top: 30px;
        }
        .art-card {
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 4px;
            padding: 12px;
            text-align: center;
            box-shadow: 4px 4px 0px #333;
            transition: transform 0.1s ease;
            display: flex;
            flex-direction: column;
        }
        .art-card:hover {
            transform: translateY(-2px);
            border-color: #ff007f;
        }
        
        /* --- FIXED CANVAS FRAME --- */
        /* This acts as a consistent, light-grey frame of exactly 200px height */
        .art-image-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center; /* Vertically centers the images */
            height: 200px; /* Limits how tall any preview can be */
            background-color: #e0e0e0; /* Light grey canvas background */
            border: 1px solid #444;
            border-radius: 4px;
            margin-bottom: 8px;
            overflow: hidden; /* Prevents large images from spilling out */
        }
        
        .art-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* Keeps original proportions without stretching */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: pointer;
        }
        .day-label {
            font-size: 0.9rem;
            color: #ff007f;
            margin-top: 8px;
            font-weight: bold;
        }
        .date-label {
            font-size: 0.8rem;
            color: #888;
            margin: 4px 0;
        }
        .title-label {
            font-size: 1rem;
            margin-top: 4px;
            font-weight: bold;
        }
        .comment-box {
            font-size: 0.85rem;
            color: #b0b0b0;
            margin-top: 12px;
            border-top: 1px dashed #444;
            padding-top: 10px;
            text-align: left;
            line-height: 1.3;
        }

        /* --- LIGHTBOX (FULL-SCREEN PREVIEW) STYLE --- */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 3px solid #ff007f;
            background-color: #e0e0e0;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <h1>DAILY PIXEL ART</h1>
    <p>Learning journey. EVH</p>

    <div class="gallery" id="gallery"></div>

    <div id="lightbox" class="lightbox">
        <img id="lightbox-img" class="lightbox-content" src="" alt="Full size preview">
    </div>

    <script>
        const artList = [
            { 
                day: 4, 
                date: "2026-06-05", 
                title: "Tenshinhan", 
                files: ["images/tenshinhan.png"],
                comment: "I'm proud of my first attempt to make something actually nice looking. It's far from perfect, but it was a nice learning experience." 
            },  
            { 
                day: 3, 
                date: "2026-06-04", 
                title: "Heideveld I", 
                files: ["images/heideveld_i.png"],
                comment: "I like dithering, this is my first attempt at dithering and also at a landscape" 
            },            
            { 
                day: 3, 
                date: "2026-06-04", 
                title: "Crab guy", 
                files: ["images/crab_guy.png"],
                comment: "HD index attempt. Messed up... I like the method and want to learn it better" 
            },
            { 
                day: 2, 
                date: "2026-06-03", 
                title: "Slime idle", 
                files: ["images/slime_idle_web.gif"],
                comment: "My first slime" 
            },
            { 
                day: 1, 
                date: "2026-06-02", 
                title: "Blue defender", 
                files: ["images/blue_defender_web.gif"],
                comment: "My first animation since 2001 or so" 
            }
        ];

        const gallery = document.getElementById('gallery');
        artList.forEach(art => {
            const card = document.createElement('div');
            card.className = 'art-card';
            
            let imagesHTML = '';
            art.files.forEach(file => {
                imagesHTML += `<img src="${file}" alt="${art.title}" class="art-image">`;
            });

            card.innerHTML = `
                <div class="art-image-container">
                    ${imagesHTML}
                </div>
                <div class="day-label">DAY ${art.day}</div>
                <div class="date-label">${art.date}</div>
                <div class="title-label">${art.title}</div>
                <div class="comment-box">${art.comment}</div>
            `;
            gallery.appendChild(card);
        });

        // Lightbox interactive script
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        gallery.addEventListener('click', (e) => {
            if (e.target.classList.contains('art-image')) {
                lightboxImg.src = e.target.src;
                lightbox.style.display = 'flex';
            }
        });

        lightbox.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });
    </script>
</body>
</html>
